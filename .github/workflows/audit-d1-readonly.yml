name: ANALISE D1 read-only schema audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analise-d1-readonly-schema-audit
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect production D1 table structure (SELECT only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: List only the expected D1 tables
        working-directory: api
        run: |
          npx wrangler d1 execute analise-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('report_versions','operational_report_sessions','operational_report_events','d1_migrations') ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: List only required API columns without reading row contents
        working-directory: api
        run: |
          npx wrangler d1 execute analise-db --remote --command="SELECT 'report_versions' AS table_name, name AS column_name FROM pragma_table_info('report_versions') WHERE name IN ('report_name','snapshot_json','created_at') UNION ALL SELECT 'operational_report_sessions' AS table_name, name AS column_name FROM pragma_table_info('operational_report_sessions') WHERE name IN ('id','status') UNION ALL SELECT 'operational_report_events' AS table_name, name AS column_name FROM pragma_table_info('operational_report_events') WHERE name IN ('session_id','source_type','event_datetime','uav_type') ORDER BY table_name,column_name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
