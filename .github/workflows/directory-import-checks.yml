name: Directory import checks
on:
  push:
    branches: [feat/universal-reference-catalog]
  pull_request:
    paths:
      - 'api/src/directories.js'
      - 'api/src/directory-import-assets.js'
      - 'api/tests/**'
      - 'api/src/synthetic-*'
      - 'api/package.json'
      - 'api/migrations/**'
      - '.github/workflows/directory-import-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: find src -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - run: npm test
