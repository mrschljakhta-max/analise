name: Deploy ANALISE API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analise-api-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: api
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Validate Worker bundle
        working-directory: api
        run: npx wrangler deploy --dry-run --outdir /tmp/analise-worker-bundle

      - name: Deploy Worker
        working-directory: api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
