name: Apply ANALISE synthetic Word D1 schema

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm applying ONLY synthetic Word migration 0019 to remote D1'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: analise-d1-synthetic-word-0019
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply 0019 (synthetic data only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit operator confirmation
        if: ${{ inputs.confirm != true }}
        run: |
          echo 'Migration 0019 requires explicit confirmation.' >&2
          exit 1

      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: Test isolated synthetic Word row storage
        working-directory: api
        run: |
          node --test tests/synthetic-word-finalized.test.js
          npx wrangler deploy --dry-run --outdir /tmp/analise-word-bundle

      - name: Verify prerequisites on remote D1 (read only)
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute analise-db --remote --command             "SELECT (SELECT COUNT(*) FROM demo_import_documents) AS docs, (SELECT COUNT(*) FROM demo_report_versions) AS revisions, (SELECT COUNT(*) FROM dq_occurrences) AS reviews;"

      # Apply only 0019. Do NOT run "d1 migrations apply" here because
      # unapplied 0017/0018 migrations may be unrelated and are not authorized.
      - name: Apply isolated 0019 migration
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute analise-db --remote --yes --file=migrations/0019_synthetic_word_records.sql

      - name: Verify physical row table (read only)
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute analise-db --remote --command             "SELECT COUNT(*) AS physically_stored_rows, SUM(CASE WHEN canonical_label IS NOT NULL THEN 1 ELSE 0 END) AS ready_rows, SUM(CASE WHEN canonical_label IS NULL THEN 1 ELSE 0 END) AS pending_rows FROM demo_word_rows;"
