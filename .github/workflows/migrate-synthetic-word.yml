name: Apply ANALISE synthetic Word D1 schema

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm applying only missing synthetic D1 migrations 0016 and 0019'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: analise-d1-synthetic-word-0019
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify and apply synthetic 0016 / 0019
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit operator confirmation
        if: ${{ inputs.confirm != true }}
        run: |
          echo 'Synthetic migrations 0016/0019 require explicit operator confirmation.' >&2
          exit 1

      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: Test synthetic migrations and Word row storage
        working-directory: api
        run: |
          node --test tests/synthetic-word-migration-plan.test.js tests/synthetic-word-remote-runner.test.js tests/synthetic-word-finalized.test.js
          npx wrangler deploy --dry-run --outdir /tmp/analise-word-bundle

      # Read sqlite_master/PRAGMA instead of querying a missing 0016 table.
      # Stop on absent 0013/0015 prerequisites or partially applied DDL.
      # After operator confirmation, apply only missing 0016 then 0019.
      # Never run generic `wrangler d1 migrations apply` here, since unrelated
      # 0017/0018 migrations may be pending and must not be touched.
      - name: Inspect and apply missing synthetic D1 schemas
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALISE_SYNTHETIC_MIGRATIONS_CONFIRMED: ${{ inputs.confirm }}
        run: node scripts/apply-synthetic-word-migrations.mjs
