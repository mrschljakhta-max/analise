name: ANALISE D1 schema migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analise-d1-schema-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        run: npm install --no-audit --no-fund
        working-directory: api

      - name: Apply only unapplied migrations
        run: npx wrangler d1 migrations apply analise-db --remote
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify created tables
        run: npx wrangler d1 execute analise-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;"
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
