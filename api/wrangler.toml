name = "analise-api"
main = "src/index.js"
compatibility_date = "2026-10-14"

# Worker's public hostname MUST be covered by a Cloudflare Access application.
# Missing Access settings cause 503/403, never unauthenticated access.
[vars]
FILE_UPLOAD_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "analise-db"
database_id = "1cbcecba-c8c6-40e4-a6d9-cc2b122c63e0"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "analise-private-documents"
